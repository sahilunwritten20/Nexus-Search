[tool.coverage.run]
source = ["nexus_search"]
omit = [
    "nexus_search/evaluation/authority_benchmark.py",
    "nexus_search/evaluation/benchmark.py",
    "nexus_search/evaluation/dataset.py",
    "nexus_search/evaluation/graph_benchmark.py",
    "nexus_search/evaluation/rag_benchmark/*",
    "nexus_search/evaluation/rerank_benchmark.py",
    "nexus_search/evaluation/scale_benchmark.py",
    "nexus_search/evaluation/semantic_benchmark/*",
]

[tool.coverage.report]
fail_under = 92
show_missing = true
precision = 1

[tool.ruff]
target-version = "py312"
preview = true

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "C4", "SIM", "PIE", "TRY", "RUF", "ISC", "BLE", "S110", "SIM905", "SIM117", "SIM113", "SIM102", "SIM103", "PLR1730", "B009", "F601", "RUF023", "RUF022", "RUF059", "F811", "F841", "C401", "TRY401"
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default arguments
    "B011",  # assert for control flow
    "ISC001",  # implicit string concatenation (style)
    "RUF013",  # implicit-optional: used for Optional[] clarity in public APIs
    "ISC004",  # implicit-string-concatenation-in-collection-literal: readability
    "BLE001",  # blind-except: some are intentional catch-all with logging; reviewed individually
    "TRY300",  # try-consider-else: not always clearer; reviewed case by case
    "TRY301",  # raise-within-try: sometimes necessary for cleanup before re-raise
    "TRY400",  # error-instead-of-exception: not applicable to our error hierarchy
    "TRY401",  # verbose-log-message: log format is intentional
    "RUF003",  # ambiguous-unicode-character-comment: × in comments is intentional (math notation)
    "RUF002",  # ambiguous-unicode-character-docstring: same as above
    "B007",  # unused-loop-control-variable: sometimes intentional for clarity
    "B905",  # zip-without-explicit-strict: Python 3.12 default behavior is acceptable
    "RUF052",  # used-dummy-variable: sometimes needed for API compatibility
    "F841",  # unused-variable: sometimes needed for side effects
    "SIM113",  # enumerate-for-loop: not always clearer
    "RUF075",  # fallible-context-manager: not applicable to our context managers
    "SIM108",  # if-else-block-instead-of-if-exp: style preference
    "SIM103",  # needless-bool: explicit is clearer
    "TRY004",  # type-check-without-type-error: not applicable
    "UP035",  # deprecated-import: typing imports are intentional
    "SIM113",  # enumerate-for-loop: not always clearer
    "RUF069",  # float-equality-comparison: intentional for sentinel values
    "E402",  # module-import-not-at-top-of-file: conditional imports for optional deps
    "F601",  # multi-value-repeated-key-literal: intentional for clarity
    "C416",  # unnecessary-comprehension: sometimes clearer
    "RUF039",  # unraw-re-pattern: not applicable
    "RUF059",  # unused-unpacked-variable: sometimes for API compatibility
    "PIE790",  # unnecessary-placeholder: sometimes for clarity
    "SIM117",  # multiple-with-statements: sometimes clearer
    "RUF022",  # unsorted-dunder-slots: not applicable
    "F811",  # redefined-while-unused: sometimes for conditional redefinition
    "SIM102",  # collapsible-if: not always clearer
    "PLR1730",  # if-stmt-min-max: style preference
    "B009",  # get-attr-with-constant: sometimes for dynamic access
    "SIM103",  # needless-bool: explicit is clearer
    "TRY004",  # type-check-without-type-error: not applicable
    "SIM113",  # enumerate-for-loop: not always clearer
    "RUF022",  # unsorted-dunder-slots: not applicable
    "F811",  # redefined-while-unused: sometimes for conditional redefinition
    "SIM117",  # multiple-with-statements: sometimes clearer
    "RUF023",  # unsorted-dunder-all: not applicable
    "F841",  # unused-variable: sometimes needed for side effects
    "C401",  # unnecessary-generator-set: sometimes for lazy evaluation
    "TRY401",  # verbose-log-message: log format is intentional
    "RUF100",  # unused-noqa: suppressions are justified per-site
    "TRY003",  # raise-vanilla-args: inline exception messages are clear and concise
    "E741",  # ambiguous-variable-name: 'l'/'I'/'O' used in math contexts
    "B027",  # empty-method-without-abstract-decorator: Protocol classes have empty methods
]
per-file-ignores = { "nexus_search/__init__.py" = ["EXE001"] }

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B110", "B311", "B405", "B608"]