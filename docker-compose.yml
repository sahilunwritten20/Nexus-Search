services:
  api:
    build: .
    # Optional pass-through (WP14-4): every NEXUS_* variable you put in a
    # gitignored `.env` file next to this compose file is injected into the
    # container — the ~25 knobs that are not listed explicitly below (weights,
    # CORS, spell budgets, ingestion caps, ...) ride along without editing
    # this file. The explicit `environment:` entries below still win over
    # env_file values, and compose's own ${VAR} interpolation also reads the
    # same .env, so the fail-closed NEXUS_API_KEY line keeps working exactly
    # as before. The file is OPTIONAL — compose boots fine without it.
    env_file:
      - path: .env
        required: false
    # Fail-closed at the compose level too: up'ing without NEXUS_API_KEY in
    # the environment errors out instead of booting an open API.
    environment:
      NEXUS_DB: /data/nexus_search.db
      NEXUS_API_KEY: ${NEXUS_API_KEY:?Set NEXUS_API_KEY before `docker compose up` (NEXUS_ENV=dev to skip)}
      NEXUS_ENV: ${NEXUS_ENV:-production}
      NEXUS_CACHE_TTL: ${NEXUS_CACHE_TTL:-5}
      NEXUS_RATE_LIMIT: ${NEXUS_RATE_LIMIT:-60/minute}
      NEXUS_EMBEDDER: ${NEXUS_EMBEDDER:-hash:384}
    ports:
      - "8000:8000"
    volumes:
      # documents/postings/vectors + crawler frontier/blocklist state
      - nexus-data:/data
    restart: unless-stopped

volumes:
  nexus-data:
