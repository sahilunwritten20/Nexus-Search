name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (pinned requirements + CPU torch wheel)
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: pip install -r requirements.txt

      - name: Hygiene - no tracked DB/bytecode artifacts (P3-11)
        run: |
          bad=$(git ls-files | grep -E '\.(db|pyc)$' || true)
          if [ -n "$bad" ]; then
            echo "tracked artifacts must not ship:"; echo "$bad"; exit 1
          fi
          echo "no tracked *.db / *.pyc files"

      - name: Run the full suite
        env:
          # no API key in CI: the suite boots the API in explicit dev mode;
          # the fail-closed boot policy itself is covered by tests
          NEXUS_ENV: dev
          NEXUS_EMBEDDER: hash:384
        run: python -m pytest -q

      - name: Lint - no duplicate test names (BUG-13 class)
        run: python scripts/dev/check_duplicate_tests.py

      - name: Lint - env vars documented in .env.example
        run: python scripts/dev/check_env_docs.py

      - name: Graph benchmark smoke (reduced mode)
        env:
          NEXUS_GRAPH_BENCH_SMOKE: "1"
        run: python -m nexus_search.evaluation.graph_benchmark

      - name: Authority on/off benchmark
        run: python -m nexus_search.evaluation.authority_benchmark

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t nexus-search:ci .

      - name: Image must not run as root
        run: |
          user="$(docker run --rm --entrypoint whoami nexus-search:ci)"
          echo "container user: $user"
          [ "$user" != "root" ]

      - name: Boot the container and probe /health
        run: |
          docker run -d --name api -p 8000:8000 \
            -e NEXUS_API_KEY=ci-secret -e NEXUS_ENV=production \
            -e NEXUS_EMBEDDER=hash:384 nexus-search:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "container healthy"; docker stop api >/dev/null; exit 0
            fi
            sleep 2
          done
          echo "container never became healthy — logs:"; docker logs api; exit 1
